version: "3.9"

services:
  llama-server:
    build:
      context: ./llama-server
    container_name: hy-mt-llama-server
    environment:
      - LLAMA_HF_REPO=sj5430/HY-MT1.5-1.8B-Q4_K_M-GGUF
      - LLAMA_HF_FILE=hy-mt1.5-1.8b-q4_k_m.gguf
      - LLAMA_CTX_SIZE=1024
      - LLAMA_THREADS=8
      - LLAMA_PORT=8080
    ports:
      - "8080:8080"
    # 如需持久化模型缓存，可解除注释
    # volumes:
    #   - ./models:/opt/llama.cpp/models

  translator-api:
    build:
      context: ./translator-api
    container_name: hy-mt-translator-api
    depends_on:
      - llama-server
    environment:
      - LLAMA_BASE_URL=http://host.docker.internal:8080
      - LLAMA_MODEL=hy-mt1.5-1.8b-q4_k_m.gguf
    ports:
      - "8000:8000"
