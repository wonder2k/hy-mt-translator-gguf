services:
  llama-server:
    build:
      context: ./llama-server
    container_name: hy-mt-llama-server
    volumes:
      - ./models:/models
    ports:
      - "8080:8080"

  translator-api:
    build:
      context: ./translator-api
    container_name: hy-mt-translator-api
    depends_on:
      - llama-server
    environment:
      - LLAMA_BASE_URL=http://host.docker.internal:8080
      - LLAMA_MODEL=hy-mt
    ports:
      - "8000:8000"
